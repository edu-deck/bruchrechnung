<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Übungsapplet zur Bruchrechnung für Klasse 7: Addition, Subtraktion, Multiplikation und Division positiver Brüche mit Schritt-für-Schritt-Erklärung.">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Bruchrechnen üben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: eine zentrierte Spalte - Steuerleiste, Aufgabenkarte, Rueckmeldung, Erklaerung */
:root {
  --bg: #F6F8FC;
  --surface: #FFFFFF;
  --surface-2: #EEF2F9;
  --line: #D7DEEB;
  --fg: #19213A;
  --muted: #5C6885;
  --accent: #1F3864;
  --accent-soft: #DCE4F4;
  --accent-ink: #FFFFFF;
  --ok: #1B6F57;
  --ok-soft: #DBEFE7;
  --warn: #9A5209;
  --warn-soft: #FAEDDA;
  --shadow: 0 1px 2px rgba(25,33,58,.06), 0 8px 24px rgba(25,33,58,.07);
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151F;
    --surface: #1A2030;
    --surface-2: #222A3C;
    --line: #2F394F;
    --fg: #E7ECF7;
    --muted: #9BA7C1;
    --accent: #9BB9EC;
    --accent-soft: #24314E;
    --accent-ink: #11151F;
    --ok: #74D6AF;
    --ok-soft: #16332A;
    --warn: #F2B86B;
    --warn-soft: #3A2B16;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151F;
  --surface: #1A2030;
  --surface-2: #222A3C;
  --line: #2F394F;
  --fg: #E7ECF7;
  --muted: #9BA7C1;
  --accent: #9BB9EC;
  --accent-soft: #24314E;
  --accent-ink: #11151F;
  --ok: #74D6AF;
  --ok-soft: #16332A;
  --warn: #F2B86B;
  --warn-soft: #3A2B16;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 660px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

/* Kopf */
header { display: flex; flex-direction: column; gap: 4px; }
.kopfzeile { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.stern {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 6px 15px 6px 12px;
  font-size: 1.125rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.stern svg { flex: none; display: block; }
.stern.zuwachs { animation: sternpop .5s ease-out; }
@keyframes sternpop {
  0% { transform: scale(1); }
  35% { transform: scale(1.22); }
  100% { transform: scale(1); }
}
h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 1.2rem + 1.6vw, 2rem);
  margin: 0; letter-spacing: -.015em; text-wrap: balance;
}
.sub { color: var(--muted); font-size: .9375rem; margin: 0; }

/* Steuerleiste */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; display: flex; flex-direction: column; gap: 14px;
}
.feldname {
  font-size: .75rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 8px;
}
.segment { display: flex; flex-wrap: wrap; gap: 8px; }
.segment button {
  font: inherit; font-weight: 500; color: var(--fg);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 16px; cursor: pointer; transition: background .15s, color .15s, border-color .15s;
  min-width: 0;
}
.segment button:hover { border-color: var(--accent); }
.segment button[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;
}
:where(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Aufgabenkarte */
.karte {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow); padding: 24px 16px; display: flex; flex-direction: column;
  gap: 16px; align-items: center;
}
.arbeitsschritt { color: var(--muted); font-size: .9375rem; text-align: center; margin: 0; }
.zeilen { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
.rechnung {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
  gap: 12px; font-size: clamp(1.375rem, 1rem + 2vw, 2rem);
  font-variant-numeric: tabular-nums; min-width: 0;
}
.op { font-family: var(--display); font-weight: 600; color: var(--accent); }

/* Bruchdarstellung */
.bruch { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.12; vertical-align: middle; }
.bruch .z { padding: 0 .25em; }
.bruch .n { padding: 0 .25em; border-top: .075em solid currentColor; }
.ganz { font-variant-numeric: tabular-nums; }

/* Eingabe */
.eingabe { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.eingabe input {
  font: inherit; font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums;
  width: 3.1em; text-align: center; padding: 5px 4px; color: var(--fg);
  background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 8px;
}
.eingabe.markiert input { border-color: var(--warn); }
.eingabe .balken { align-self: stretch; height: 2px; background: currentColor; border-radius: 2px; }
.eingabe label {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
@media (max-width: 460px) { .eingabe input { width: 2.6em; font-size: 1.0625rem; } .rechnung { gap: 8px; } }

/* Knoepfe */
.knoepfe { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
  padding: 10px 18px; border: 1.5px solid var(--accent); transition: filter .15s, background .15s;
}
.btn-primaer { background: var(--accent); color: var(--accent-ink); }
.btn-primaer:hover { filter: brightness(1.12); }
.btn-sekundaer { background: transparent; color: var(--accent); }
.btn-sekundaer:hover { background: var(--accent-soft); }

/* Rueckmeldung */
.rueck { border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.rueck.ok { background: var(--ok-soft); color: var(--ok); }
.rueck.nein { background: var(--warn-soft); color: var(--warn); }
.rueck .kopf { font-weight: 700; }
.rueck .zusatz { font-weight: 400; font-size: .9375rem; line-height: 1.55; }

/* Erklaerung */
.erklaerung {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
  border-radius: 12px; padding: 16px 18px;
}
.erklaerung h2 {
  font-family: var(--display); font-size: 1rem; margin: 0 0 10px; color: var(--accent);
  letter-spacing: .01em;
}
.erklaerung ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 10px; }
.erklaerung li { line-height: 1.7; }
.erklaerung .schritt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 1.05rem; }
.erklaerung .hinweis { color: var(--muted); font-size: .9375rem; margin-top: 10px; }

/* Zaehlerleiste */
.stand {
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline;
  color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums;
}
.stand b { color: var(--fg); font-variant-numeric: tabular-nums; }
.stand button {
  font: inherit; font-size: .875rem; color: var(--muted); background: none; border: none;
  padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.stand button:hover { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kopfzeile">
      <h1>Bruchrechnen üben</h1>
      <div class="stern" id="stern" title="Richtig gelöste Aufgaben">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 2.4l2.95 5.98 6.6.96-4.78 4.65 1.13 6.57L12 17.46l-5.9 3.1 1.13-6.57L2.45 9.34l6.6-.96z"/>
        </svg>
        <b id="z-richtig">0</b>
        <span class="eingabe-label" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">richtig gelöste Aufgaben</span>
      </div>
    </div>
    <p class="sub">Wähle eine Rechenart. Rechne im Kopf und trage Zähler und Nenner ein – vollständig gekürzt.</p>
  </header>

  <section class="panel" aria-label="Einstellungen">
    <div>
      <p class="feldname" id="lbl-art">Rechenart</p>
      <div class="segment" role="group" aria-labelledby="lbl-art" id="artwahl">
        <button type="button" data-art="add" aria-pressed="true">Addition</button>
        <button type="button" data-art="sub" aria-pressed="false">Subtraktion</button>
        <button type="button" data-art="mul" aria-pressed="false">Multiplikation</button>
        <button type="button" data-art="div" aria-pressed="false">Division</button>
      </div>
    </div>
    <div>
      <p class="feldname" id="lbl-stufe">Schwierigkeit</p>
      <div class="segment" role="group" aria-labelledby="lbl-stufe" id="stufenwahl">
        <button type="button" data-stufe="leicht" aria-pressed="true">leicht</button>
        <button type="button" data-stufe="normal" aria-pressed="false">normal</button>
      </div>
    </div>
  </section>

  <section class="karte" aria-label="Aufgabe">
    <p class="arbeitsschritt" id="arbeitsschritt" hidden></p>
    <div class="zeilen" id="zeilen"></div>
    <div class="knoepfe">
      <button type="button" class="btn btn-primaer" id="btn-pruefen">Prüfen</button>
      <button type="button" class="btn btn-primaer" id="btn-neu" hidden>Neue Aufgabe</button>
      <button type="button" class="btn btn-sekundaer" id="btn-erklaeren">Erklär es mir noch einmal</button>
    </div>
  </section>

  <div class="rueck" id="rueck" role="status" aria-live="polite" hidden></div>

  <section class="erklaerung" id="erklaerung" hidden aria-label="Erklärung"></section>

  <div class="stand">
    <span>Bearbeitet: <b id="z-gesamt">0</b></span>
    <button type="button" id="btn-reset">zurücksetzen</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Bruch-Werkzeuge ---------- */
  var ggt = function (a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; };
  var kgv = function (a, b) { return a / ggt(a, b) * b; };
  var kuerze = function (z, n) { var g = ggt(z, n) || 1; return { z: z / g, n: n / g }; };
  var rnd = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };

  var NENNER = [2, 3, 4, 5, 6, 8, 10, 12];
  var OPZEICHEN = { add: "+", sub: "−", mul: "·", div: ":" };
  var ARTNAME = { add: "Addition", sub: "Subtraktion", mul: "Multiplikation", div: "Division" };
  var TUWORT = { add: "addiere", sub: "subtrahiere" };

  function bruchHTML(z, n) {
    if (n === 1) return '<span class="ganz">' + z + "</span>";
    return '<span class="bruch"><span class="z">' + z + '</span><span class="n">' + n + "</span></span>";
  }
  function op(zeichen) { return '<span class="op">' + zeichen + "</span>"; }

  /* ---------- Aufgaben erzeugen ---------- */
  function echterBruch(maxZ, maxN) {
    for (var i = 0; i < 80; i++) {
      var n = rnd(2, maxN);
      var z = rnd(1, Math.min(maxZ, n - 1));
      if (ggt(z, n) === 1) return { z: z, n: n };
    }
    return { z: 1, n: 3 };
  }

  /**
   * Setzt gelegentlich einen Zähler auf 0 - bei Addition, Subtraktion und Multiplikation.
   * Bei der Subtraktion nur den zweiten Bruch, damit das Ergebnis nicht negativ wird.
   * Die Division bleibt außen vor: dort gibt es zu 0 keinen Kehrwert.
   */
  function vielleichtNull(art, a, b) {
    if (art === "div" || Math.random() > 0.10) return;
    if (art === "sub") { b.z = 0; return; }
    if (Math.random() < 0.5) { a.z = 0; } else { b.z = 0; }
  }

  function rechne(art, a, b) {
    if (art === "add") return { z: a.z * b.n + b.z * a.n, n: a.n * b.n };
    if (art === "sub") return { z: a.z * b.n - b.z * a.n, n: a.n * b.n };
    if (art === "mul") return { z: a.z * b.z, n: a.n * b.n };
    return { z: a.z * b.n, n: a.n * b.z };
  }

  function erzeuge(art, stufe) {
    for (var i = 0; i < 600; i++) {
      var a, b, t;
      if (art === "add" || art === "sub") {
        if (stufe === "leicht") {
          var n = pick(NENNER);
          a = { z: rnd(1, n - 1), n: n };
          b = { z: rnd(1, n - 1), n: n };
        } else {
          var na = pick(NENNER), nb = pick(NENNER);
          if (na === nb || kgv(na, nb) > 24) continue;
          a = { z: rnd(1, na - 1), n: na };
          b = { z: rnd(1, nb - 1), n: nb };
        }
        if (ggt(a.z, a.n) !== 1 || ggt(b.z, b.n) !== 1) continue;
        if (art === "sub") {
          if (a.z * b.n === b.z * a.n) continue;
          if (a.z * b.n < b.z * a.n) { t = a; a = b; b = t; }
        }
      } else if (art === "mul") {
        a = stufe === "leicht" ? echterBruch(3, 6) : echterBruch(9, 12);
        b = stufe === "leicht" ? echterBruch(3, 6) : echterBruch(9, 12);
        if (stufe === "normal" && a.z === 1 && b.z === 1) continue;
      } else {
        a = stufe === "leicht" ? echterBruch(4, 8) : echterBruch(9, 10);
        b = stufe === "leicht" ? echterBruch(4, 7) : echterBruch(9, 10);
        if (b.z === 1) continue;                        // Kehrwert soll ein echter Bruch sein
      }

      vielleichtNull(art, a, b);

      var auf = baue(art, stufe, a, b);
      if (auf.roh.z < 0) continue;                    // nie ein negatives Ergebnis
      if (auf.roh.z === 0 && art !== "mul") continue; // 0 nur als Produkt
      if (auf.erg.z !== 0 && auf.erg.n === 1) continue;        // ganze Zahlen aussparen
      if (auf.erg.n > 36 || auf.erg.z > 60) continue; // im Kopf noch machbar
      if (auf.erweitern && ggt(auf.zs, auf.h) !== 1) continue;  // Zwischenergebnis = Endergebnis
      return auf;
    }
    // Rückfall: feste, immer gültige Aufgabe je Rechenart (a ist stets größer als b)
    var fest = { add: [{ z: 1, n: 2 }, { z: 1, n: 3 }], sub: [{ z: 1, n: 2 }, { z: 1, n: 3 }],
                 mul: [{ z: 1, n: 2 }, { z: 2, n: 3 }], div: [{ z: 1, n: 2 }, { z: 2, n: 3 }] }[art];
    return baue(art, stufe, fest[0], fest[1]);
  }

  /** Baut aus zwei Brüchen die vollständige Aufgabe samt Zwischenschritten. */
  function baue(art, stufe, a, b) {
    var roh = rechne(art, a, b);
    var auf = { art: art, stufe: stufe, a: a, b: b, roh: roh, erg: kuerze(roh.z, roh.n),
                erweitern: false, kehrwert: false };
    if (art === "div") {
      auf.kehrwert = true;
      auf.kz = b.n; auf.kn = b.z;
      auf.pz = a.z * b.n; auf.pn = a.n * b.z;
    }
    if ((art === "add" || art === "sub") && a.n !== b.n) {
      var h = kgv(a.n, b.n);
      auf.erweitern = true; auf.h = h;
      auf.z1 = a.z * (h / a.n); auf.z2 = b.z * (h / b.n);
      auf.zs = art === "add" ? auf.z1 + auf.z2 : auf.z1 - auf.z2;
    }
    return auf;
  }

  /* ---------- Erklärung ---------- */
  function schritt(html) { return '<div class="schritt">' + html + "</div>"; }
  function gl(x) { return op("=") + x; }

  function erklaerung(auf) {
    var a = auf.a, b = auf.b, e = auf.erg, li = [], hinweis = "";
    var zeichen = OPZEICHEN[auf.art];
    var aufgabeHTML = bruchHTML(a.z, a.n) + op(zeichen) + bruchHTML(b.z, b.n);

    if (auf.art === "add" || auf.art === "sub") {
      var wort = TUWORT[auf.art];
      if (!auf.erweitern) {
        var r1 = auf.art === "add" ? a.z + b.z : a.z - b.z;
        li.push("<b>Die Nenner sind gleich.</b> Der Nenner bleibt stehen, " + wort + " nur die Zähler." +
          schritt(aufgabeHTML + gl(bruchHTML(a.z + (auf.art === "add" ? " + " : " − ") + b.z, a.n))));
        li.push("Zähler ausrechnen:" + schritt(bruchHTML(r1, a.n)));
        li.push(kuerzschritt(r1, a.n, e));
      } else {
        li.push("<b>Hauptnenner suchen.</b> Das kleinste gemeinsame Vielfache von " + a.n + " und " + b.n +
          " ist <b>" + auf.h + "</b>.");
        li.push("<b>Beide Brüche erweitern</b> – den ersten mit " + (auf.h / a.n) +
          ", den zweiten mit " + (auf.h / b.n) + ". Zähler und Nenner werden mit derselben Zahl multipliziert." +
          schritt(bruchHTML(a.z, a.n) + gl(bruchHTML(auf.z1, auf.h)) +
                  '<span style="width:16px"></span>' +
                  bruchHTML(b.z, b.n) + gl(bruchHTML(auf.z2, auf.h))));
        li.push("Jetzt sind die Nenner gleich – " + wort + " nur die Zähler, der Nenner bleibt " + auf.h + "." +
          schritt(bruchHTML(auf.z1, auf.h) + op(zeichen) + bruchHTML(auf.z2, auf.h) +
                  gl(bruchHTML(auf.zs, auf.h))));
        li.push(kuerzschritt(auf.zs, auf.h, e));
        hinweis = "Tipp: Der Hauptnenner ist nicht immer das Produkt der beiden Nenner – oft reicht eine kleinere Zahl.";
      }
    } else if (auf.art === "mul") {
      li.push("<b>Zähler mal Zähler, Nenner mal Nenner.</b>" +
        schritt(aufgabeHTML + gl(bruchHTML(a.z + " · " + b.z, a.n + " · " + b.n))));
      li.push("Ausrechnen:" + schritt(bruchHTML(auf.roh.z, auf.roh.n)));
      li.push(kuerzschritt(auf.roh.z, auf.roh.n, e));
      hinweis = "Tipp: Du darfst schon vor dem Multiplizieren kürzen – über Kreuz. Dann bleiben die Zahlen klein.";
    } else {
      li.push("<b>Durch einen Bruch teilen heißt: mit seinem Kehrwert multiplizieren.</b> " +
        "Der Kehrwert von " + bruchHTML(b.z, b.n) + " ist " + bruchHTML(b.n, b.z) + ".");
      li.push("Aus der Division wird eine Multiplikation:" +
        schritt(aufgabeHTML + gl(bruchHTML(a.z, a.n) + op("·") + bruchHTML(b.n, b.z))));
      li.push("Zähler mal Zähler, Nenner mal Nenner:" + schritt(bruchHTML(auf.roh.z, auf.roh.n)));
      li.push(kuerzschritt(auf.roh.z, auf.roh.n, e));
    }

    var html = "<h2>So geht die " + ARTNAME[auf.art] + "</h2><ol><li>" + li.join("</li><li>") + "</li></ol>";
    if (hinweis) html += '<p class="hinweis">' + hinweis + "</p>";
    return html;
  }

  function kuerzschritt(z, n, e) {
    if (z === 0) {
      return "<b>Ergebnis:</b> Der Zähler ist 0, der Nenner bleibt " + n +
        ". Gekürzt wird hier nichts – ein Bruch mit 0 im Zähler hat immer den Wert 0." +
        schritt(bruchHTML(0, n));
    }
    var g = ggt(z, n);
    if (g === 1) {
      return "<b>Kürzen:</b> Zähler und Nenner haben keinen gemeinsamen Teiler mehr – " +
        "das Ergebnis steht schon vollständig gekürzt da." + schritt(bruchHTML(e.z, e.n));
    }
    return "<b>Kürzen:</b> Zähler und Nenner durch <b>" + g + "</b> teilen." +
      schritt(bruchHTML(z, n) + gl(bruchHTML(e.z, e.n)));
  }

  /* ---------- Oberfläche ---------- */
  var elZeilen = document.getElementById("zeilen");
  var elSchritt = document.getElementById("arbeitsschritt");
  var elRueck = document.getElementById("rueck");
  var elErkl = document.getElementById("erklaerung");
  var btnPruefen = document.getElementById("btn-pruefen");
  var btnErkl = document.getElementById("btn-erklaeren");
  var btnNeu = document.getElementById("btn-neu");
  var btnReset = document.getElementById("btn-reset");
  var zRichtig = document.getElementById("z-richtig");
  var elStern = document.getElementById("stern");
  var zGesamt = document.getElementById("z-gesamt");

  var art = "add", stufe = "leicht", aufgabe = null, geloest = false, gezaehlt = false;
  var richtig = 0, gesamt = 0;

  try {
    var sp = localStorage.getItem("bruchtrainer");
    if (sp) { var o = JSON.parse(sp); if (ARTNAME[o.art]) art = o.art; if (o.stufe === "normal") stufe = o.stufe; }
  } catch (e) { /* ohne gespeicherte Auswahl weiter */ }

  function speichern() {
    try { localStorage.setItem("bruchtrainer", JSON.stringify({ art: art, stufe: stufe })); } catch (e) {}
  }

  function markiere(id, attr, wert) {
    var knoepfe = document.getElementById(id).querySelectorAll("button");
    for (var i = 0; i < knoepfe.length; i++) {
      knoepfe[i].setAttribute("aria-pressed", knoepfe[i].getAttribute(attr) === wert ? "true" : "false");
    }
  }

  function feldHTML(pre, name) {
    return '<span class="eingabe" id="box-' + pre + '">' +
      '<label for="' + pre + 'z">Zähler ' + name + '</label>' +
      '<input id="' + pre + 'z" inputmode="numeric" autocomplete="off">' +
      '<span class="balken"></span>' +
      '<label for="' + pre + 'n">Nenner ' + name + '</label>' +
      '<input id="' + pre + 'n" inputmode="numeric" autocomplete="off">' +
      "</span>";
  }

  function feld(pre) {
    var z = document.getElementById(pre + "z"), n = document.getElementById(pre + "n");
    var zv = parseInt((z.value || "").trim(), 10), nv = parseInt((n.value || "").trim(), 10);
    return { z: zv, n: nv, leer: !(isFinite(zv) && isFinite(nv)), box: document.getElementById("box-" + pre) };
  }

  function zeigeAufgabe() {
    aufgabe = erzeuge(art, stufe);
    geloest = false; gezaehlt = false;
    var zeichen = OPZEICHEN[art];
    var kopf = bruchHTML(aufgabe.a.z, aufgabe.a.n) + op(zeichen) + bruchHTML(aufgabe.b.z, aufgabe.b.n);

    if (aufgabe.erweitern) {
      elSchritt.textContent = "Mache die Brüche zuerst gleichnamig – erweitere beide auf den Hauptnenner.";
      elSchritt.hidden = false;
      elZeilen.innerHTML =
        '<div class="rechnung">' + kopf + op("=") +
          feldHTML("f1", "erster Bruch") + op(zeichen) + feldHTML("f2", "zweiter Bruch") +
          op("=") + feldHTML("fe", "Ergebnis") + "</div>";
    } else if (aufgabe.kehrwert) {
      elSchritt.textContent = "Schreibe zuerst den Kehrwert des zweiten Bruchs auf, dann das Ergebnis.";
      elSchritt.hidden = false;
      elZeilen.innerHTML =
        '<div class="rechnung">' + kopf + op("=") +
          bruchHTML(aufgabe.a.z, aufgabe.a.n) + op("·") + feldHTML("f2", "Kehrwert") +
          op("=") + feldHTML("fe", "Ergebnis") + "</div>";
    } else {
      elSchritt.hidden = true;
      elSchritt.textContent = "";
      elZeilen.innerHTML = '<div class="rechnung">' + kopf + op("=") + feldHTML("fe", "Ergebnis") + "</div>";
    }

    elRueck.hidden = true;
    elRueck.className = "rueck";
    elErkl.hidden = true;
    elErkl.innerHTML = "";
    btnNeu.hidden = true;
    btnPruefen.hidden = false;
    bindeEingaben();
    var erstes = document.getElementById(aufgabe.erweitern ? "f1z" : (aufgabe.kehrwert ? "f2z" : "fez"));
    if (erstes) erstes.focus();
  }

  function bindeEingaben() {
    var felder = elZeilen.querySelectorAll("input");
    for (var i = 0; i < felder.length; i++) {
      felder[i].addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { ev.preventDefault(); if (geloest) { zeigeAufgabe(); } else { pruefe(); } }
      });
    }
  }

  function melde(klasse, kopf, zusatz) {
    elRueck.className = "rueck " + klasse;
    elRueck.innerHTML = '<span class="kopf">' + kopf + "</span>" +
      (zusatz ? '<span class="zusatz">' + zusatz + "</span>" : "");
    elRueck.hidden = false;
  }

  function markiereFeld(box) {
    var alle = elZeilen.querySelectorAll(".eingabe");
    for (var i = 0; i < alle.length; i++) alle[i].classList.remove("markiert");
    if (box) box.classList.add("markiert");
  }

  function falsch(text, box) {
    markiereFeld(box || null);
    melde("nein", "Versuche es erneut.", text);
  }

  /* ---------- Prüfen ---------- */
  function pruefe() {
    if (aufgabe.erweitern) { pruefeErweitert(); }
    else if (aufgabe.kehrwert) { pruefeKehrwert(); }
    else { pruefeEinfach(); }
  }

  function zaehleAufgabe() {
    if (!gezaehlt) { gesamt++; gezaehlt = true; zGesamt.textContent = gesamt; }
  }

  function korrekt() {
    markiereFeld(null);
    melde("ok", "Korrekt.", "");
    richtig++; zRichtig.textContent = richtig;
    elStern.classList.remove("zuwachs");
    void elStern.offsetWidth;                     // Animation neu starten
    elStern.classList.add("zuwachs");
    geloest = true;
    btnPruefen.hidden = true;
    btnNeu.hidden = false;
    btnNeu.focus();
  }

  function pruefeEinfach() {
    var f = feld("fe"), e = aufgabe.erg, a = aufgabe.a, b = aufgabe.b;
    if (f.leer) { falsch("Trage oben den Zähler und unten den Nenner ein.", f.box); return; }
    zaehleAufgabe();
    if (f.n === 0) { falsch("Der Nenner darf nicht 0 sein.", f.box); return; }
    if (f.z < 0 || f.n < 0) { falsch("Hier wird nur mit positiven Brüchen gerechnet.", f.box); return; }

    if (e.z === 0) {
      if (f.z !== 0) {
        falsch("Ist einer der beiden Zähler 0, ist auch das Produkt der Zähler 0.", f.box);
        return;
      }
      if (f.n !== aufgabe.roh.n) {
        falsch("Der Zähler stimmt. Rechne auch den Nenner aus: " + a.n + " · " + b.n + " = " +
          aufgabe.roh.n + ".", f.box);
        return;
      }
      korrekt(); return;
    }
    if (f.z === e.z && f.n === e.n) { korrekt(); return; }

    if (f.z * e.n === e.z * f.n) {
      markiereFeld(f.box);
      melde("nein", "Fast!", "Der Wert stimmt, aber der Bruch ist noch nicht vollständig gekürzt. " +
        "Teile Zähler und Nenner durch " + ggt(f.z, f.n) + ".");
      return;
    }
    if (f.z === e.n && f.n === e.z) { falsch("Zähler und Nenner sind vertauscht.", f.box); return; }
    falsch(diagnose(f, a, b, e), f.box);
  }

  function diagnose(f, a, b, e) {
    var art = aufgabe.art;
    if (art === "add" || art === "sub") {
      if (f.n === a.n + b.n) {
        return "Die Nenner werden nicht " + (art === "add" ? "addiert" : "subtrahiert") +
          ". Bei gleichem Nenner rechnest du nur mit den Zählern, der Nenner bleibt " + a.n + ".";
      }
      if (f.n === a.n) {
        return "Der Nenner stimmt. Rechne die Zähler noch einmal: " + a.z +
          (art === "add" ? " + " : " − ") + b.z + ".";
      }
      return "Der Nenner bleibt bei gleichnamigen Brüchen stehen – hier also " + a.n + ".";
    }
    if (art === "mul") {
      if (f.z === a.z + b.z || f.n === a.n + b.n) {
        return "Beim Multiplizieren wird nicht addiert: Zähler mal Zähler, Nenner mal Nenner.";
      }
      if (f.n * ggt(a.n * b.n, f.n) === a.n * b.n && f.z !== e.z) {
        return "Der Nenner passt. Multipliziere auch die beiden Zähler miteinander: " + a.z + " · " + b.z + ".";
      }
      return "Rechne Zähler mal Zähler und Nenner mal Nenner – und kürze das Ergebnis danach.";
    }
    // Division
    if (f.z * (a.n * b.n) === (a.z * b.z) * f.n) {
      return "Du hast die beiden Brüche multipliziert. Beim Teilen multiplizierst du mit dem Kehrwert des zweiten Bruchs, also mit " +
        (b.z === 1 ? String(b.n) : b.n + "/" + b.z) + ".";
    }
    if (f.z * (a.z * b.n) === (a.n * b.z) * f.n) {
      return "Gestürzt wird nur der zweite Bruch, nicht der erste.";
    }
    return "Schreibe die Division zuerst als Multiplikation mit dem Kehrwert des zweiten Bruchs.";
  }

  function pruefeErweitert() {
    var f1 = feld("f1"), f2 = feld("f2"), fe = feld("fe");
    var a = aufgabe.a, b = aufgabe.b, h = aufgabe.h, e = aufgabe.erg;
    var wort = aufgabe.art === "add" ? "addierst" : "subtrahierst";

    if (f1.leer || f2.leer || fe.leer) {
      falsch("Fülle alle sechs Felder aus: beide gleichnamigen Brüche und das Ergebnis.",
        f1.leer ? f1.box : (f2.leer ? f2.box : fe.box));
      return;
    }
    zaehleAufgabe();
    if (f1.n <= 0 || f2.n <= 0 || fe.n <= 0) { falsch("Ein Nenner darf nicht 0 oder negativ sein.", null); return; }

    // 1) gemeinsamer Nenner
    if (f1.n !== h || f2.n !== h) {
      if (f1.n !== f2.n) {
        falsch("Die beiden Brüche haben noch nicht denselben Nenner. Erweitere beide auf den Hauptnenner " +
          h + " – das kleinste gemeinsame Vielfache von " + a.n + " und " + b.n + ".",
          f1.n === h ? f2.box : f1.box);
        return;
      }
      if (f1.n % a.n === 0 && f1.n % b.n === 0) {
        falsch(f1.n + " ist zwar ein gemeinsamer Nenner, aber nicht der kleinste. Der Hauptnenner von " +
          a.n + " und " + b.n + " ist " + h + ".", f1.box);
        return;
      }
      falsch(f1.n + " ist kein gemeinsamer Nenner von " + a.n + " und " + b.n + ". Gesucht ist das kleinste gemeinsame Vielfache.", f1.box);
      return;
    }

    // 2) richtig erweitert
    if (f1.z !== aufgabe.z1) {
      falsch("Der Nenner des ersten Bruchs stimmt. Beim Erweitern wird der Zähler mit derselben Zahl multipliziert: " +
        a.n + " · " + (h / a.n) + " = " + h + ", also " + a.z + " · " + (h / a.n) + ".", f1.box);
      return;
    }
    if (f2.z !== aufgabe.z2) {
      falsch("Der zweite Bruch ist noch nicht richtig erweitert: " + b.n + " · " + (h / b.n) + " = " + h +
        ", also auch " + b.z + " · " + (h / b.n) + ".", f2.box);
      return;
    }

    // 3) Ergebnis
    if (fe.n !== h) {
      if (fe.n === h + h || fe.n === 2 * h) {
        falsch("Die Nenner werden nicht addiert. Beide Brüche haben den Nenner " + h + " – der bleibt stehen.", fe.box);
        return;
      }
      falsch("Beide Brüche haben jetzt den Nenner " + h + ". Dieser Nenner bleibt im Ergebnis stehen.", fe.box);
      return;
    }
    if (fe.z !== aufgabe.zs) {
      falsch("Die erweiterten Brüche stimmen. Jetzt " + wort + " du nur noch die Zähler: " +
        aufgabe.z1 + (aufgabe.art === "add" ? " + " : " − ") + aufgabe.z2 + ".", fe.box);
      return;
    }
    if (fe.z !== e.z || fe.n !== e.n) {
      markiereFeld(fe.box);
      melde("nein", "Fast!", "Kürze das Ergebnis noch vollständig: teile Zähler und Nenner durch " + ggt(fe.z, fe.n) + ".");
      return;
    }
    korrekt();
  }

  function pruefeKehrwert() {
    var f2 = feld("f2"), fe = feld("fe");
    var a = aufgabe.a, b = aufgabe.b, e = aufgabe.erg;

    if (f2.leer || fe.leer) {
      falsch("Fülle beide Brüche aus: zuerst den Kehrwert, dann das Ergebnis.", f2.leer ? f2.box : fe.box);
      return;
    }
    zaehleAufgabe();
    if (f2.n <= 0 || fe.n <= 0) { falsch("Ein Nenner darf nicht 0 oder negativ sein.", null); return; }

    // 1) Kehrwert des zweiten Bruchs
    if (f2.z !== aufgabe.kz || f2.n !== aufgabe.kn) {
      if (f2.z === b.z && f2.n === b.n) {
        falsch("Das ist der zweite Bruch unverändert. Beim Kehrwert werden Zähler und Nenner vertauscht: aus " +
          b.z + "/" + b.n + " wird " + b.n + "/" + b.z + ".", f2.box);
        return;
      }
      if (f2.z === a.n && f2.n === a.z) {
        falsch("Gestürzt wird der zweite Bruch, nicht der erste.", f2.box);
        return;
      }
      falsch("Der Kehrwert von " + b.z + "/" + b.n + " ist " + b.n + "/" + b.z +
        " – Zähler und Nenner tauschen einfach die Plätze.", f2.box);
      return;
    }

    // 2) Ergebnis
    if (fe.z === e.z && fe.n === e.n) { korrekt(); return; }

    if (fe.z * e.n === e.z * fe.n) {
      markiereFeld(fe.box);
      melde("nein", "Fast!", "Der Wert stimmt, aber der Bruch ist noch nicht vollständig gekürzt. " +
        "Teile Zähler und Nenner durch " + ggt(fe.z, fe.n) + ".");
      return;
    }
    if (fe.z === e.n && fe.n === e.z) { falsch("Zähler und Nenner sind vertauscht.", fe.box); return; }
    if (fe.z * (a.z * b.z) === (a.n * b.n) * fe.n) {
      falsch("Du hast hier noch mit dem ursprünglichen zweiten Bruch gerechnet. " +
        "Multipliziere " + a.z + "/" + a.n + " mit dem Kehrwert " + aufgabe.kz + "/" + aufgabe.kn + ".", fe.box);
      return;
    }
    falsch("Der Kehrwert stimmt. Jetzt Zähler mal Zähler und Nenner mal Nenner: " +
      a.z + " · " + aufgabe.kz + " und " + a.n + " · " + aufgabe.kn + " – danach kürzen.", fe.box);
  }

  /* ---------- Ereignisse ---------- */
  btnPruefen.addEventListener("click", pruefe);
  btnNeu.addEventListener("click", zeigeAufgabe);
  btnErkl.addEventListener("click", function () {
    if (elErkl.hidden) {
      elErkl.innerHTML = erklaerung(aufgabe);
      elErkl.hidden = false;
      elErkl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else {
      elErkl.hidden = true;
    }
  });
  btnReset.addEventListener("click", function () {
    richtig = 0; gesamt = 0; zRichtig.textContent = "0"; zGesamt.textContent = "0";
  });

  document.getElementById("artwahl").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-art]");
    if (!b) return;
    art = b.getAttribute("data-art");
    markiere("artwahl", "data-art", art);
    speichern(); zeigeAufgabe();
  });
  document.getElementById("stufenwahl").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-stufe]");
    if (!b) return;
    stufe = b.getAttribute("data-stufe");
    markiere("stufenwahl", "data-stufe", stufe);
    speichern(); zeigeAufgabe();
  });

  markiere("artwahl", "data-art", art);
  markiere("stufenwahl", "data-stufe", stufe);
  zeigeAufgabe();
})();
</script>
</body>
</html>
